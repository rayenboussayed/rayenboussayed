# Netlify configuration — single source of truth for the deploy.
# Without this file the site was published from the repo root, so the dev
# index.html was served (/src/main.tsx as application/octet-stream) and the
# page rendered blank. Build locally reproduces the same dist/ this publishes.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26.13.1" # keep in sync with .nvmrc

# Required for the on-device translation tiers (SharedArrayBuffer /
# crossOriginIsolated). Mirrors the dev/preview servers in vite.config.ts.
# `credentialless` keeps the cross-origin Google Fonts stylesheet working.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Hashed build artifacts are immutable; content changes get a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
